name: Verify About icon synchronization

on:
  push:
    branches: [main]
    paths:
      - '.github/about-icons.json'
      - '.github/workflows/verify-suite-icons.yml'
      - 'src/lib/suiteApps.ts'
      - 'src/components/AboutModal.tsx'
      - 'src/i18n.ts'
      - 'src/index.css'
      - 'scripts/sync-suite-icons.mjs'
      - 'package*.json'
      - 'public/suite/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Refresh About icons from official app repositories
        uses: CyberGems/CyberSnap/.github/actions/sync-suite-icons@80266c5b4ad7fa4c5768e2543a4c7c7a461fc8f7
        with:
          config: .github/about-icons.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify local release icon synchronization
        run: npm run icons:sync
      - run: npm run lint
      - run: npm test
      - run: npm run build
