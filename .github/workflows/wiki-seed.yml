name: Seed wiki

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose wiki API availability
        env:
          GH_TOKEN: ${{ secrets.WIKI_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          api() { curl -s -o /tmp/o.json -w "%{http_code}" -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$1"; }
          echo "repos/CyberNotes        -> $(api https://api.github.com/repos/CyberGems/CyberNotes)"
          echo "repos/CyberNotes/wiki   -> $(api https://api.github.com/repos/CyberGems/CyberNotes/wiki)"
          echo "repos/CyberNotes/wiki/p -> $(api https://api.github.com/repos/CyberGems/CyberNotes/wiki/pages)"
          echo "repos/CyberNotes/commits-> $(api https://api.github.com/repos/CyberGems/CyberNotes/commits)"
          echo "--- create CyberGo wiki page ---"
          echo "PUT wiki/pages           -> $(curl -s -o /tmp/c.json -w '%{http_code}' -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" -d '{"title":"Home","body":"Welcome to the CyberGo wiki!"}' "https://api.github.com/repos/$REPO/wiki/pages")"
          head -c 300 /tmp/c.json
          echo
