name: Seed wiki

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the wiki API from GitHub infrastructure
        env:
          GH_TOKEN: ${{ secrets.WIKI_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "--- GET wiki pages on a repo that HAS pages (CyberNotes) ---"
          curl -s -o /tmp/a.json -w "http=%{http_code}\n" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/CyberGems/CyberNotes/wiki/pages"
          head -c 200 /tmp/a.json
          echo
          echo "--- PUT create the first page on CyberGo ---"
          curl -s -o /tmp/b.json -w "http=%{http_code}\n" -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"title":"Home","body":"Welcome to the CyberGo wiki!"}' \
            "https://api.github.com/repos/$REPO/wiki/pages"
          head -c 300 /tmp/b.json
          echo
