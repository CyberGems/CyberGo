name: Seed wiki

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Push the first wiki page with a user token
        env:
          GH_TOKEN: ${{ secrets.WIKI_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir -p /tmp/wikiseed
          cd /tmp/wikiseed
          git init -q -b master
          git config user.name "CyberGems"
          git config user.email "282432203+CyberGems@users.noreply.github.com"
          printf 'Welcome to the CyberGo wiki!\n' > Home.md
          git add Home.md
          git commit -qm "Initial Home page"
          git push "https://${GH_TOKEN}@github.com/${REPO}.wiki.git" master 2>&1 | tail -5
