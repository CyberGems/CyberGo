name: Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Validate release summary
        run: node .github/scripts/validate-release-summary.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      # Build only, never let electron-builder publish on tag (avoids
      # double-upload and API flakes): --publish never keeps the packaging
      # honest, because on a tag push electron-builder would otherwise try
      # to publish itself and demand a GitHub token. The build:electron
      # script syncs the About icons, compiles the renderer and the main
      # process, and packages the NSIS installer and portable executable into release/.
      - name: Compile and Package Electron App
        run: npm run build:electron -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Build Artifacts to Actions Run
        uses: actions/upload-artifact@v6
        with:
          name: CyberGo-Windows-Installer
          path: |
            release/*.exe
          if-no-files-found: error

      # The published asset keeps the CyberGo.Setup.<version>.exe name the
      # releases have always carried, and SHA256SUMS.txt goes next to it so
      # the download can be verified without opening the release page.
      - name: Stage the release files and checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER_NUM="${TAG#v}"
          INSTALLER=$(ls release/CyberGo-"$VER_NUM"-setup.exe)
          PORTABLE=$(ls release/CyberGo-Portable-"$VER_NUM".exe)
          if [ ! -f "$INSTALLER" ]; then
            echo "::error::Installer not found: release/CyberGo-$VER_NUM-setup.exe"
            exit 1
          fi
          if [ ! -f "$PORTABLE" ]; then
            echo "::error::Portable executable not found: release/CyberGo-Portable-$VER_NUM.exe"
            exit 1
          fi
          mkdir -p staging
          cp "$INSTALLER" "staging/CyberGo.Setup.$VER_NUM.exe"
          cp "$PORTABLE" "staging/CyberGo-Portable-$VER_NUM.exe"
          (cd staging && sha256sum "CyberGo.Setup.$VER_NUM.exe" "CyberGo-Portable-$VER_NUM.exe" > SHA256SUMS.txt)
          echo "installer: CyberGo.Setup.$VER_NUM.exe"
          echo "sha256:    $(grep -F 'CyberGo.Setup.' staging/SHA256SUMS.txt | cut -d' ' -f1)"
          echo "portable:  CyberGo-Portable-$VER_NUM.exe"
          echo "sha256:    $(grep -F 'CyberGo-Portable-' staging/SHA256SUMS.txt | cut -d' ' -f1)"

      # Prefer gh CLI with retries over a single publish call: GitHub has
      # been returning intermittent 503s during release create/upload.
      - name: Create GitHub Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER_NUM="${TAG#v}"
          FILES=(staging/CyberGo.Setup."$VER_NUM".exe staging/CyberGo-Portable-"$VER_NUM".exe staging/SHA256SUMS.txt)

          retry() {
            local attempt=1
            local max=6
            local delay=8
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "Giving up after ${max} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt}/${max} failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          ensure_release() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              # Keep an existing draft as a draft so notes can be reviewed
              # before publish. Assets are still uploaded below.
              return 0
            fi
            # Draft like the rest of the suite: nothing goes live until the
            # draft is reviewed and published by hand.
            gh release create "$TAG" \
              --title "CyberGo $TAG" \
              --generate-notes \
              --draft
          }

          retry ensure_release

          for f in "${FILES[@]}"; do
            echo "Uploading $f"
            retry gh release upload "$TAG" "$f" --clobber
          done

          echo "Release ${TAG} staged:"
          gh release view "$TAG" --json url,isDraft,assets --jq '{url,isDraft,assets:[.assets[].name]}'

      # Upload the freshly built installer to VirusTotal so the SHA256 link
      # in the release body resolves as soon as the draft is published (new
      # builds are unknown to VirusTotal until someone submits them).
      - name: Scan builds with VirusTotal
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $files = @(
            (Get-ChildItem -Path "./staging" -Filter "CyberGo.Setup.*.exe" | Select-Object -First 1)
            (Get-ChildItem -Path "./staging" -Filter "CyberGo-Portable-*.exe" | Select-Object -First 1)
          ) | Where-Object { $_ }
          if ($files.Count -lt 2) {
            throw "Installer and portable executables are required in ./staging"
          }
          foreach ($file in $files) { Write-Host "Build: $($file.Name)" }

          if ($env:VIRUSTOTAL_API_KEY) {
            function Upload-VirusTotal($filePath, $apiKey) {
              $item = Get-Item $filePath
              $sizeMb = [Math]::Round($item.Length / 1MB, 2)
              Write-Host "Uploading $filePath ($sizeMb MB) to VirusTotal..."
              $headers = @{ "x-apikey" = $apiKey }
              $url = "https://www.virustotal.com/api/v3/files"

              if ($item.Length -gt 30MB) {
                Write-Host "File exceeds 30MB ($sizeMb MB), requesting dedicated large-file upload endpoint from VirusTotal..."
                $urlResp = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Method Get -Headers $headers -TimeoutSec 60
                $url = $urlResp.data
                Write-Host "Using dedicated endpoint: $url"
              }

              & curl.exe -s -S --fail -X POST -H "x-apikey: $apiKey" -F "file=@$filePath" "$url" | Out-Null
              Write-Host "Upload successful."
            }

            foreach ($file in $files) {
              try {
                Upload-VirusTotal $file.FullName $env:VIRUSTOTAL_API_KEY
              } catch {
                Write-Warning "VirusTotal upload warning for $($file.Name): $_"
              }
            }
          } else {
            Write-Host "VIRUSTOTAL_API_KEY secret not found; skipping the upload. The SHA256 checksums still ship in SHA256SUMS.txt."
          }

      # Render .github/release-template.md with the real version and SHA256
      # hash so the release body matches the rest of the suite (direct
      # download links, no manual copy-paste).
      - name: Render release notes from template
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER_NUM="${TAG#v}"

          retry() {
            local attempt=1
            local max=6
            local delay=8
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "Giving up after ${max} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt}/${max} failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          INSTALLER_HASH=$(grep -F 'CyberGo.Setup.' staging/SHA256SUMS.txt | cut -d' ' -f1)
          PORTABLE_HASH=$(grep -F 'CyberGo-Portable-' staging/SHA256SUMS.txt | cut -d' ' -f1)
          if [ -z "$INSTALLER_HASH" ] || [ -z "$PORTABLE_HASH" ]; then
            echo "::error::Installer or portable hash is empty"
            exit 1
          fi
          echo "installer: CyberGo.Setup.$VER_NUM.exe"
          echo "sha256:    $INSTALLER_HASH"
          echo "portable:  CyberGo-Portable-$VER_NUM.exe"
          echo "sha256:    $PORTABLE_HASH"

          sed -e "s/{{VERSION}}/$TAG/g" \
              -e "s/{{VERSION_NUM}}/$VER_NUM/g" \
              -e "s/{{INSTALLER_HASH}}/$INSTALLER_HASH/g" \
              -e "s/{{PORTABLE_HASH}}/$PORTABLE_HASH/g" \
              .github/release-template.md > FINAL_RELEASE_NOTES.md
              sed -i '/<!--.*-->/d' FINAL_RELEASE_NOTES.md

          # Apply the rendered notes (keeps draft state when present)
          retry gh release edit "$TAG" --notes-file FINAL_RELEASE_NOTES.md

          echo "Release ${TAG} notes applied from template."
